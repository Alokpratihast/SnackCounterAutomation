name: .NET CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SnackCounterAutomation.slnx
      - name: Build
        run: dotnet build SnackCounterAutomation.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test SnackCounterAutomation.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
